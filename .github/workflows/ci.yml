name: ci
on: [push, pull_request]
jobs:
  lint-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: deps
        run: python -m pip install pywin32 psutil fastapi uvicorn numpy Pillow jinja2 pytest ruff
      - name: lint (errors only)
        run: ruff check vclab bin tests
      - name: machine.toml for CI (no engines)
        shell: bash
        run: |
          cat > machine.toml <<'TOML'
          engines_root = 'C:\ci\engines'
          builds_root = 'C:\ci\builds'
          work_root = 'C:\ci\work'
          python_win = 'C:\hostedtoolcache\python.exe'
          TOML
      - name: pytest (no engine)
        env:
          LAB_SKIP_ENGINE: "1"
        run: python -X utf8 -B -m pytest -q tests
