[package]
name = "olife-gateway"
version = "0.1.0"
edition = "2021"
description = "Olife production gateway sockets_auth: handshake/auth, bans, rate limits, keepalive, session multiplexing into the world"
publish = false

[lib]
name = "olife_gateway"
path = "src/lib.rs"

[[bin]]
name = "olife-gateway"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
panic = "unwind"
