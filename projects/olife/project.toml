# Вид `client` (F2F 0.32), но без соединения: tools/lab/projects/olife/scripts/olife_client_smoke.lua грузит паки клиента
# (только недостающие — в окне base уже загружен меню), открывает локальный мир, маркер готовности; затем hello/shot.
# `lab lease olife client_smoke --start` -> `lab f2f <аренда> shot` -> `lab release`. Часы — --param clock=virtual|realtime.
[kinds.client_smoke]
description = "client smoke: VoxelCoreF2F-0327 (--f2f, input isolated, hidden, realtime) + lab olife_client_smoke.lua (no gateway): world open + hello + shot"
exe = "{engine.builds.f2f}"
