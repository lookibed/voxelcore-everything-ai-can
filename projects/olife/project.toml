[play]
description = "Olife: supervised stack (world on D:\\Prog\\Olife\\play, real sandbox, auth tickets, Rust gateway, account user, sample benches) via the play_stack sidecar + STOCK 0.32 runtime auto-connecting by ticket"
order = ["play_stack", "runtime"]      # коляска (стек готов) -> рантайм; стоп обратный: рантайм уже вышел -> play_stack stop
engine = "runtime"                     # выход окна = конец сеанса
names = { runtime = "vc032-main" }     # рантайм один на машину
exclusive_exe = "D:\\Prog\\VoxelCore\\voxelcore-0.32.7_win64\\VoxelCore.exe"   # уже запущен вне лаборатории -> отказ
ttl = 3600
[play.params.play_stack]
mode = "play"
# публичный режим (olife_friends 16.10): фиксированные порты (TCP; проброс на роутере один раз). Не пересекаются с демоном
# (25700), пулом аренд (25600–25699), тестовыми демонами (25791–25793), изолированными демонами и их арендами (25800–26349),
# лаунчером Eaglercraft (25599). Перекрыть — D:\Prog\Olife\play\server.toml, секция [public] с теми же ключами.
[play.public]
gateway = 27750          # шлюз: единственное, что знает друг (ip:27750)
auth = 27751             # сервис билетов (HTTPS, самоподписанный + запечатанный запрос к ключу из ServerInfo)
packs = 27752            # раздача паков и активов (HTTP, только файлы манифеста и CAS по sha256)
whitelist = true         # вход по нику — только из вайтлиста (play.bat friend НИК)
name = "Olife"           # имя сервера в ServerInfo
motd = ""
[play.options.public]    # `lab play olife --user --public` (= --opt public) / `play.bat public`: стек на портах [play.public], 0.0.0.0
params = { play_stack = { public = 1 } }
[play.capture]
enabled = false
[play.report]
log_stream = "stdout"                  # print/debug.log клиента + журнал движка (latest.log — без print)
server_kind = "play_stack"             # «сервер» отчёта — коляска: события стека, сводка play_down
server_stream = "stdout"
server_tail = 60
size = "окно пользователя (settings.toml 0.32)"
chunks_field = "chunks"
status = '\[olife_play\] status fps (?P<fps>[\d.]+) frames (?P<frames>\d+) state (?P<state>\S+) ping (?P<ping_ms>[-\d.]+) entities (?P<entities>\d+) chunks (?P<chunks>\d+) kb_in (?P<kb_in>\d+) kb_out (?P<kb_out>\d+) reconnects (?P<reconnects>\d+)'
disconnect_events = ["disconnect"]
[play.report.levels]
error = '^\[E\]|uncaught|stack traceback|Exception'
warning = '^\[W\]'
[play.report.events]
world_open = '\[olife_play\] world open (?P<world>\S+)'
connect = '\[olife_play\] connected account=(?P<account>\S+) session=(?P<session>\S+)'
disconnect = '\[olife_play\] disconnected state=\S+ reason=(?P<reason>.*)$'
packs = '\[olife_play\] packs reopen'
leave = '\[olife_play\] (?:leaving after|world closed)'
no_config = '\[olife_play\] no .*olife_server'
[play.report.server_events]
ready = '\[olife_play\] stack ready in (?P<s>[\d.]+) s'
login = '\[olife_play\] login (?P<who>\S+)'
logout = '\[olife_play\] logout (?P<who>\S+)'
incident = '\[olife_play\] incident (?P<id>\S+)'
restart = '\[olife_play\] restart (?P<role>\S+)'
failed = '\[olife_play\] .*FAILED'

