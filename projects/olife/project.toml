[kinds.play_client]
description = "dry-run client: VoxelCoreF2F-0327 (--f2f, input isolated, hidden, realtime) + content/olife_client/scripts/app/olife.lua, export\\olife_server.txt = {param.config}; default 0.32 project (no --project) like the stock runtime"
