# ------------------------------------------------------------------ волна 4b (olife_w4b): сервис билетов (tools/olife/auth_service.py)
# Долгий токен аккаунта -> короткий одноразовый билет для Hello.token (tools/olife/olife_ticket.py). HTTPS (ssl, самоподписанный
# сертификат генерируется в каталог аренды) или HTTP (tls=0); аккаунты и баны — БД supervisor (auth_url = /sup демона), файлы —
# запасной путь; master — файл мастер-ключа (сессия генерирует его и выводит из него ключ шлюза); порт управления f2f:
# hello, metrics, mint (только для негативных тестов), quit.
[kinds.auth]
description = "auth: tools/olife/auth_service.py — account token -> short one-time ticket (HMAC per gateway), HTTPS self-signed (dev) + sealed request to a pinned x25519 key"
engine = "none"
exe = "{python}"
ports = ["https", "f2f"]
f2f = "f2f"
cwd = "{dir}"
args = ["-u", "-B", "{vc_root}\\tools\\olife\\auth_service.py", "--listen", "{port.https}", "--f2f", "{port.f2f}", "--dir", "{dir}",
        "--master", "{param.master}", "--ttl", "{param.ttl}", "--gateways", "{param.gateways}", "--auth-url", "{param.auth_url}",
        "--require-sealed", "{param.require_sealed}", "--tls", "{param.tls}", "--seal-key", "{param.seal_key}"]
params = { master = "", ttl = 30, gateways = "", auth_url = "", require_sealed = 0, tls = 1, seal_key = "" }
default_log = "stdout"
ready = [ { f2f = "hello", timeout = 20 }, { log = "\\[olife_auth\\] ready", stream = "stdout", timeout = 20 } ]
stop = [ { f2f = "quit", wait_exit = 3 } ]

# ================================================================== путь игрока (02.10, olife_play): lab play olife
# `lab play olife --user` (пользователь, свой терминал или D:\Prog\Olife\play.bat) / `--final-check --reason` (главная
# сессия): [play].order — сначала «коляска» play_stack (поднимает стек под supervisor: olife.play_up в olife_play.py), затем
# СТОКОВЫЙ рантайм 0.32 (окно пользователя) со скриптом content/olife_client/scripts/app/olife.lua (он же — пункт меню
# «Сценарии» -> olife). Выход рантайма = конец сеанса: play.py гасит коляску (stdin stop -> olife.play_down: сводка
# olife_session.md в прогон, сохранение мира, снятие группы) и пишет play_report.md. Сухой прогон (без стокового движка) —
# `lab play olife --dry-run` = сценарий olife_play_dry (тот же стек + клиент F2F 0.32 с тем же скриптом).

# мир игры: как world, но worlds\ — junction на постоянный каталог миров (D:\Prog\Olife\play\worlds) или копию (сухой прогон)
[kinds.world_play]
description = "world for the player: stock VoxelCore 0.32 --headless server_start.lua (content/olife_world); worlds\\ = junction to {param.worlds} (persistent D:\\Prog\\Olife\\play\\worlds or a dry-run copy)"
role = "headless"
exe = "{engine.stock}"
copy_exe = false
ports = ["game"]
stdin = true
stdin_poke = "console"
cwd = "{dir}"
args = ["--headless", "{param.mode}", "{dir}\\{param.script}", "--tps", "{param.tps}", "--dir", "{dir}",
        "--res", "{engine.res}", "--project", "{project_dir}\\vcproject", "--log", "{dir}\\world.log", "--stdin-cmd",
        "--", "--port", "{port.game}", "--ticks", "{param.ticks}", "--sandbox", "{param.sandbox}",
        "--sandbox-proto", "{param.sandbox_proto}", "--secret", "{param.secret}", "--view", "{param.view}",
        "--mobs", "{param.mobs}", "--scripted", "{param.scripted}", "--journal-every", "{param.journal_every}",
        "--opts", "{param.opts}"]
params = { mode = "--script", script = "server_start.lua", tps = 20, ticks = 0, sandbox = 0, sandbox_proto = "bin", secret = "olife-dev-secret", view = 3, mobs = 0, scripted = 0, journal_every = 20, opts = "none", worlds = "", packs = ["olife_proto", "olife_world"] }
logs = { log = "{dir}\\world.log" }
default_log = "stdout"
prepare = [
  { action = "packs", packs = "{param.packs}" },
  { action = "copy", src = "{vc_root}\\content\\olife_world\\{param.script}", dst = "{param.script}" },
  { action = "mkdir", path = "export" },
  { action = "junction", link = "worlds", target = "{param.worlds}" },
]
ready = [ { log = "\\[olife_world\\] ready", stream = "stdout", timeout = 90 } ]
stop = [ { stdin = "olife.stop\n", wait_exit = 15 } ]

# «коляска» сеанса игры: поднимает/снимает стек через HTTP демона (olife.play_up/play_down), печатает статус стека
[kinds.play_stack]
description = "play sidecar: tools/lab/projects/olife/play_stack.py — olife.play_up (supervised world on the persistent world + real sandbox + auth tickets + Rust gateway + account user + sample benches + client config), stack status every 10 s, olife.play_down on stop"
engine = "none"
exe = "{python}"
cwd = "{dir}"
args = ["-u", "-B", "{project_dir}\\play_stack.py", "--owner", "{owner}", "--lease", "{lease}", "--dir", "{dir}",
        "--run-dir", "{run_dir}", "--mode", "{param.mode}", "--daemon-port", "{param.daemon_port}", "--public", "{param.public}"]
# public = 1 (olife_friends 16.10): `lab play olife --user --public` / `play.bat public` -> fixed ports of [play.public] on 0.0.0.0
params = { mode = "play", daemon_port = 25700, public = 0 }
stdin = true
default_log = "stdout"
ready = [ { log = "\\[olife_play\\] stack ready", stream = "stdout", timeout = 240 } ]
stop = [ { stdin = "stop\n", wait_exit = 120 } ]

# рантайм игрока: СТОКОВЫЙ VoxelCore 0.32 (только lab play: --user / --final-check), обычное окно, каталог пользователя
# 0.32 (его settings.toml; content\olife_client, content\olife_proto — junction на VC_ROOT\content, sync в olife.play_up),
# скрипт меню «Сценарии» -> olife, адрес — export\olife_server.txt (пишет olife.play_up). Одна аренда на машину.
[kinds.runtime]
description = "runtime: STOCK VoxelCore 0.32 (voxelcore-0.32.7_win64\\VoxelCore.exe), normal window, user dir = the 0.32 root (its settings, content junctions), --script content\\olife_client\\scripts\\app\\olife.lua -> export\\olife_server.txt"
role = "runtime"
exe = "{engine.stock}"
copy_exe = false
