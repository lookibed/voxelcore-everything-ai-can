cwd = "{engine.root}"
args = ["--dir", "{engine.root}", "--script", "{engine.root}\\content\\olife_client\\scripts\\app\\olife.lua"]
logs = { latest = "{engine.root}\\latest.log" }
default_log = "stdout"
ready = [ { log = "\\[olife_play\\] (menu ready|world open)", stream = "stdout", timeout = 120 } ]   # UX B: the menu first
stop = []

# сухой прогон: тестовая сборка F2F 0.32 (ввод изолирован, окно скрыто, часы realtime) с тем же скриптом и файлом
