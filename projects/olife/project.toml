# паки olife и векторы кодеков (tools/olife/tests/codec_vectors.lua читает user:export/vectors/*.json)
prepare = [ { action = "mkdir", path = "shots" },
            { action = "packs", packs = "{param.packs}" },
            { action = "copytree", src = "{vc_root}\\tools\\olife\\protocol\\vectors", dst = "export\\vectors" } ]
ready = []
stop = []

[kinds.vctest_window]
description = "native 0.32 test in a window: VoxelCoreF2F-0327 --f2f (input isolated, hidden, realtime) --test <file.lua>"
exe = "{engine.builds.f2f}"
copy_exe = true
ports = ["f2f"]
f2f = "f2f"
size = "854x480"
clock = "realtime"
cwd = "{dir}"
args = ["--f2f", "{port.f2f}", "--f2f-size", "{size}", "--test", "{param.test}", "--res", "{engine.res}", "--project", "{project_dir}\\vcproject",
