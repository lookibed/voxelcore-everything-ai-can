# vc — запуски движка для разработки паков (MCP vc_start в vclab/mcp/voxelcore_mcp.py) и тесты движка (vctests).
# Этап 3а: вместо стокового VoxelCore.exe — тестовая сборка F2F с `--f2f <порт> --f2f-clock realtime` (время идёт само,
# step не нужен; ввод ОС изолирован, окно без фокуса). --dir по умолчанию — <work_root>\vc_dev (latest.log,
# autorun_app_script.txt, export\); паки — `--param packs=a,b`: junction {repo_root}\packs\<пак> -> <dir>\content\<пак>
# (снимаются при release); --res — res движка аренды ({engine.res}: res 0.31 под сборкой 0.32.7 — 0xC0000409, волна 7).
# --dir/--res из args vc_start перекрывают. Репозиторий самодостаточен: путей к другим установкам здесь нет.
# Стоковый рантайм (вид runtime) — только `lab play vc --user` (пользователь) или vc_start(play=true, reason) =
# `--final-check` главной сессии (claude), запись runtime_session в истории.
[project]
name = "vc"
description = "pack development launches (MCP vc_start): VoxelCoreF2F.exe, clock realtime, input isolated"
runs_dir = "{lab_data}\\runs"
# этап 4: lab run vc <имя|файл.lua> — тесты движка 0.32 под --test (vctests\: копия upstream world.lua и пробы лаборатории)
scenarios_dir = "{project_dir}\\vctests"

[scenario]
vctest = { headless = "vctest", window = "vctest_window" }

[kinds.dev]
description = "F2F build --f2f <port> --f2f-clock realtime, window hidden, --dir <work_root>\\vc_dev (vc_start), packs from {repo_root}\\packs (--param packs=a,b), --res of the engine"
exe = "{param.engine_exe}"
copy_exe = true
ports = ["f2f"]
f2f = "f2f"
clock = "realtime"
window = "hidden"          # окно СКРЫТО (02.11: normal показывал окно на рабочем столе пользователя). Видимое — только
                           # по просьбе пользователя: --param window=normal. vc_screenshot снимает F2F shot (буфер кадра).
cwd = "{param.dir}"
args = ["--f2f", "{port.f2f}", "--res", "{param.res}", "--dir", "{param.dir}", "{param.extra}"]
params = { engine_exe = "{engine.builds.f2f}", dir = "{work_root}\\vc_dev", res = "{engine.res}", packs = [], extra = [] }
prepare = [ { action = "mkdir", path = "{param.dir}" }, { action = "packs", packs = "{param.packs}", into = "{param.dir}\\content" } ]
logs = { latest = "{param.dir}\\latest.log" }
default_log = "latest"
ready = [ { f2f = "hello", timeout = 90 } ]
stop = [ { f2f = "quit", wait_exit = 8 } ]
# этап 4a: `--param engine=v032` — тестовая сборка 0.32 (VoxelCoreF2F-032.exe), res 0.32, --dir = каталог аренды (не VC_ROOT:
# 0.32 перепишет settings.toml/latest.log пользовательского каталога 0.31), кадр 854x480, окно hidden; часы — `--param clock=`
[kinds.dev.by_engine.v032]
window = "hidden"
size = "854x480"
args = ["--f2f", "{port.f2f}", "--f2f-size", "{size}", "--res", "{param.res}", "--dir", "{param.dir}", "{param.extra}"]
params = { engine_exe = "{engine.builds.f2f}", dir = "{dir}", res = "{engine.res}" }

# ---------------------------------------------------------------- этап 4a: голая тестовая сборка (меню, пробы, F2F-протокол)
[kinds.engine]
description = "F2F test build of the lease's engine (registry default v0327; --param engine=<id>): menu, --dir = lease dir, 854x480, hidden, clock virtual (--param clock=realtime)"
exe = "{engine.builds.f2f}"
copy_exe = true
ports = ["f2f"]
f2f = "f2f"
size = "854x480"
clock = "virtual"
cwd = "{dir}"
args = ["--f2f", "{port.f2f}", "--f2f-size", "{size}", "--res", "{engine.res}", "--dir", "{dir}", "{param.extra}"]
params = { extra = [] }
logs = { latest = "{dir}\\latest.log" }
default_log = "latest"
ready = [ { f2f = "hello", timeout = 90 } ]
stop = [ { f2f = "quit", wait_exit = 8 } ]

# ---------------------------------------------------------------- проверка чужого/скачанного проекта (user:project)
# Каталог проекта (project.toml, start.lua, content\) копируется в <каталог аренды>\project — движок подхватывает его как
# user:project, как у пользователя в <установка>\project. Оригинал и установку пользователя не трогаем.
#   lab_lease project=vc kind=user_project params={"src": "D:\\...\\ocult-fab"} start=true
# Окно hidden, кадр 854x480, часы virtual (кадры — только по F2F step); --param clock=realtime — если нужно «живое» время.
# Курсор F2F стартует в (0,0): RTS-камеры с прокруткой от края поедут — первым input поставьте мышь в центр кадра.
[kinds.user_project]
description = "foreign/downloaded VoxelCore project (user:project): --param src=<Windows dir with project.toml>, copied into the lease dir; F2F, hidden, 854x480, clock virtual, muted"
exe = "{engine.builds.f2f}"
copy_exe = true
ports = ["f2f"]
f2f = "f2f"
size = "854x480"
clock = "virtual"
window = "hidden"
cwd = "{dir}"
args = ["--f2f", "{port.f2f}", "--f2f-size", "{size}", "--res", "{engine.res}", "--dir", "{dir}", "{param.extra}"]
params = { src = "", extra = [] }
prepare = [
  { action = "copytree", src = "{param.src}", dst = "project", robocopy = false },
  { action = "write", path = "settings.toml", text = "[audio]\nvolume-master = 0\n" }
]
logs = { latest = "{dir}\\latest.log" }
default_log = "latest"
ready = [ { f2f = "hello", timeout = 90 } ]
stop = [ { f2f = "quit", wait_exit = 8 } ]

# Папка пользователя целиком (как <установка>: project\, worlds\, config\…) — когда проект поставляется вместе с мирами
# (user:worlds). --param src=<Windows dir> копируется ПОВЕРХ каталога аренды; settings.toml аренды (звук 0) пишется после.
[kinds.user_dir]
description = "foreign project shipped as a user dir (project\\ + worlds\\ …): --param src=<Windows dir>, copied into the lease dir; F2F, hidden, 854x480, clock virtual, muted"
exe = "{engine.builds.f2f}"
copy_exe = true
ports = ["f2f"]
f2f = "f2f"
size = "854x480"
clock = "virtual"
window = "hidden"
cwd = "{dir}"
args = ["--f2f", "{port.f2f}", "--f2f-size", "{size}", "--res", "{engine.res}", "--dir", "{dir}", "{param.extra}"]
params = { src = "", extra = [] }
prepare = [
  { action = "copytree", src = "{param.src}", dst = ".", fresh = false, robocopy = false },
  { action = "write", path = "settings.toml", text = "[audio]\nvolume-master = 0\n" }
]
logs = { latest = "{dir}\\latest.log" }
default_log = "latest"
ready = [ { f2f = "hello", timeout = 90 } ]
stop = [ { f2f = "quit", wait_exit = 8 } ]

# ---------------------------------------------------------------- стоковый рантайм: только lab play / final-check
[kinds.runtime]
description = "stock VoxelCore.exe of the engine, normal mode (the user's settings and input) in <work_root>\\vc_runtime: play/final-check only"
role = "runtime"
exe = "{engine.stock}"
copy_exe = false
kill_on_close = false
cwd = "{param.dir}"
args = ["--dir", "{param.dir}", "{param.extra}"]
params = { dir = "{work_root}\\vc_runtime", packs = [], extra = [] }
prepare = [ { action = "mkdir", path = "{param.dir}" }, { action = "packs", packs = "{param.packs}", into = "{param.dir}\\content" } ]
logs = { latest = "{param.dir}\\latest.log" }
default_log = "latest"
ready = []
stop = []

[play]
description = "stock runtime VoxelCore.exe (start script via autorun_app_script.txt in --dir)"
order = ["runtime"]
engine = "runtime"
names = { runtime = "vc-main" }
exclusive_exe = "{engine.stock}"
ttl = 3600
[play.report]
log_stream = "latest"

# ---------------------------------------------------------------- этап 4: тесты движка 0.32 (`--test`, вид сценария vctest)
[kinds.vctest]
description = "native 0.32+ test: stock VoxelCore --headless --test <file.lua> --log (exit code = verdict); engine — registry default or --engine"
role = "headless"
exe = "{engine.stock}"
copy_exe = false
cwd = "{dir}"
args = ["--headless", "--test", "{param.test}", "--res", "{engine.res}", "--project", "{project_dir}\\vcproject", "--dir", "{dir}", "--log", "{dir}\\test.log"]
params = { test = "" }
logs = { log = "{dir}\\test.log" }
default_log = "stdout"
prepare = [ { action = "mkdir", path = "shots" } ]
ready = []
stop = []

[kinds.vctest_window]
description = "native 0.32+ test in a window: F2F build --f2f (input isolated, hidden) --test <file.lua>; clock virtual (runner steps) or realtime"
exe = "{engine.builds.f2f}"
copy_exe = true
ports = ["f2f"]
f2f = "f2f"
size = "854x480"
clock = "virtual"           # этап 4a: раннер vctest задаёт параметр clock сам (умолчание virtual + шаги; --clock realtime)
cwd = "{dir}"
args = ["--f2f", "{port.f2f}", "--f2f-size", "{size}", "--test", "{param.test}", "--res", "{engine.res}", "--project", "{project_dir}\\vcproject",
        "--dir", "{dir}", "--log", "{dir}\\test.log"]
params = { test = "" }
logs = { log = "{dir}\\test.log" }
default_log = "stdout"
prepare = [ { action = "mkdir", path = "shots" } ]
ready = [ { f2f = "hello", timeout = 90 } ]
stop = []
