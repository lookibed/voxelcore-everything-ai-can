# wasmrt: обычные программы (C/Java -> wasm -> Lua транслятором Spider) в паке wasmrt на странице меню.
# Экземпляр — F2F-сборка движка без мира: стартовый сценарий tools/scenarios/wasmrt_page.lua открывает страницу
# wasmrt_app с программой из манифеста (export:wasmrt_manifest.txt в --dir экземпляра). Снимок — F2F shot (FBO),
# ввод — F2F input. Пример другого манифеста: --param manifest=html:wasm.json --param packs=wasmrt,html
[project]
name = "wasmrt"
description = "wasmrt programs (wasm -> Lua) on the menu page of a VoxelCore F2F engine instance"
scenarios_dir = "{vc_root}\\tools\\scenarios"
runs_dir = "{lab_data}\\runs"
plugin = "plugin.py"

# интерпретатор сценариев (labcore/scenario.py): одна реализация — движок; хуков нет, старт по умолчанию (аренда engine,
# параметры вида — из поля "params": {"engine": {...}} сценария), шаги — команды F2F как есть
[scenario]
impls = { vc = "engine" }
default_size = "854x480"

[compare]
tool = "{vc_root}\\tools\\reference\\compare.py"
size = "854x480"
tol = 0
clear = [0, 0, 0]

[kinds.engine]
description = "VoxelCoreF2F.exe, start script user:<script> (default wasmrt_page.lua), manifest from param"
exe = "{param.engine_exe}"
copy_exe = true
ports = ["f2f"]
f2f = "f2f"
size = "854x480"
args = ["--f2f", "{port.f2f}", "--f2f-size", "{size}", "--res", "{vc_root}\\res", "--dir", "{dir}"]
logs = { latest = "{dir}\\latest.log" }
default_log = "latest"
params = { engine_exe = "D:\\Prog\\AlphaMine\\engine\\VoxelCoreF2F.exe", manifest = "wasmdemo:wasm.json", packs = ["wasmrt", "wasmdemo"], script = "wasmrt_page.lua", ready_marker = "\\[wasmrt_page\\] ready", max_frames = 600 }
prepare = [
  { action = "template", src = "engine_settings.toml", dst = "settings.toml" },
  { action = "packs", packs = "{param.packs}" },
  { action = "copy", src = "{vc_root}\\tools\\scenarios\\{param.script}", dst = "{param.script}" },
  { action = "write", path = "autorun_app_script.txt", text = "user:{param.script}" },
  { action = "write", path = "export\\wasmrt_manifest.txt", text = "{param.manifest}" },
]
# сценарий меню (app.sleep, загрузка программы) идёт только в кадрах F2F: шагать до маркера в latest.log
ready = [
  { f2f = "hello", timeout = 60 },
  { pump_log = "{param.ready_marker}", stream = "latest", max_frames = "{param.max_frames}" },
]
stop = [ { f2f = "quit", wait_exit = 8 } ]

# ---------------------------------------------------------------- порт на 0.32.1 (06.10, port032)
# Движок v032 проекта: res/stock/vctest — стоковый релиз 0.32.1 (D:\Prog\VoxelCore\voxelcore-0.32.1_win64), тестовая
# сборка F2F — та же VoxelCoreF2F-032.exe (dc62ccfb + патч F2F; разница dc62ccfb → v0.32.1 — только res/modules/animation*,
# formats/vca.lua, components/animator.lua и два шейдера, см. agents/research/VC032_ADAPTATION.md «0.32.1»). Перекрытие
# нужно ещё и потому, что lab.toml указывает на D:\Prog\VoxelCore\voxelcore-0.32_dc62ccfb, которого на диске нет
# (каталог называется voxelcore-0.32.0_dc62ccfb) — lab.toml агентам менять нельзя.
[engines.v032]
root = "D:\\Prog\\VoxelCore\\voxelcore-0.32.1_win64"
res = "D:\\Prog\\VoxelCore\\voxelcore-0.32.1_win64\\res"
stock = "D:\\Prog\\VoxelCore\\voxelcore-0.32.1_win64\\VoxelCore.exe"
builds = { f2f = "D:\\Prog\\AlphaMine\\engine\\032\\VoxelCoreF2F-032.exe", stock = "D:\\Prog\\VoxelCore\\voxelcore-0.32.1_win64\\VoxelCore.exe", vctest = "D:\\Prog\\VoxelCore\\voxelcore-0.32.1_win64\\vctest.exe" }

# `lab lease wasmrt engine --param engine=v032 ...`: стартовый сценарий — штатный `--script` 0.32 (autorun_app_script.txt
# читает только наш project_client.lua в res 0.31); res — 0.32.1. Часы — `--param clock=realtime` для замеров fps.
[kinds.engine.by_engine.v032]
exe = "{engine.builds.f2f}"
args = ["--f2f", "{port.f2f}", "--f2f-size", "{size}", "--res", "{engine.res}", "--dir", "{dir}", "--script", "{dir}\\{param.script}"]

# Мир пользователя на тестовой сборке: копия мира (copytree из param.world_src) + паки из packs.list + сценарий
# tools/scenarios/pc_world.lua (export:pc_world.txt = имя мира, export:pc_enter.txt = 1 — сразу за компьютер).
# v031: сценарий через autorun_app_script.txt (project_client.lua в res 0.31); v032: `--script`.
[kinds.world]
description = "VoxelCoreF2F (v031 | --param engine=v032): copy of a user world (param world_src) + packs, start script pc_world.lua"
exe = "{engine.builds.f2f}"
copy_exe = true
ports = ["f2f"]
f2f = "f2f"
size = "854x480"
clock = "realtime"
args = ["--f2f", "{port.f2f}", "--f2f-size", "{size}", "--res", "{engine.res}", "--dir", "{dir}"]
logs = { latest = "{dir}\\latest.log" }
default_log = "latest"
params = { world = "fineltest", world_src = "{vc_root}\\worlds\\fineltest", packs = ["wasmrt", "pc_wasmrt", "videoplayer", "doom", "eaglercraft", "quake", "html"], script = "pc_world.lua", enter = "1", launch = "", ready_marker = "\\[pc_world\\] ready", ready_timeout = 180 }
prepare = [
  { action = "template", src = "engine_settings.toml", dst = "settings.toml" },
  { action = "packs", packs = "{param.packs}" },
  { action = "copytree", src = "{param.world_src}", dst = "worlds\\{param.world}" },
  { action = "copy", src = "{vc_root}\\tools\\scenarios\\{param.script}", dst = "{param.script}" },
  { action = "write", path = "autorun_app_script.txt", text = "user:{param.script}" },
  { action = "write", path = "export\\pc_world.txt", text = "{param.world}" },
  { action = "write", path = "export\\pc_enter.txt", text = "{param.enter}" },
  { action = "write", path = "export\\pc_launch.txt", text = "{param.launch}" },
]
ready = [
  { f2f = "hello", timeout = 60 },
  { log = "{param.ready_marker}", stream = "latest", timeout = "{param.ready_timeout}" },
]
stop = [ { f2f = "quit", wait_exit = 8 } ]

[kinds.world.by_engine.v032]
args = ["--f2f", "{port.f2f}", "--f2f-size", "{size}", "--res", "{engine.res}", "--dir", "{dir}", "--script", "{dir}\\{param.script}"]

# Та же страница wasmrt, но часы realtime (замеры fps как в README паков): в realtime F2F `step` отвечает
# `clock-realtime`, поэтому готовность — ожидание строки лога, а не pump_log.
[kinds.engine_rt]
description = "as engine, clock realtime (fps measurements): ready = log marker, not pump_log"
exe = "{param.engine_exe}"
copy_exe = true
ports = ["f2f"]
f2f = "f2f"
size = "854x480"
clock = "realtime"
args = ["--f2f", "{port.f2f}", "--f2f-size", "{size}", "--res", "{vc_root}\\res", "--dir", "{dir}"]
logs = { latest = "{dir}\\latest.log" }
default_log = "latest"
params = { engine_exe = "D:\\Prog\\AlphaMine\\engine\\VoxelCoreF2F.exe", manifest = "wasmdemo:wasm.json", packs = ["wasmrt", "wasmdemo"], script = "wasmrt_page.lua", ready_marker = "\\[wasmrt_page\\] ready", ready_timeout = 120 }
prepare = [
  { action = "template", src = "engine_settings.toml", dst = "settings.toml" },
  { action = "packs", packs = "{param.packs}" },
  { action = "copy", src = "{vc_root}\\tools\\scenarios\\{param.script}", dst = "{param.script}" },
  { action = "write", path = "autorun_app_script.txt", text = "user:{param.script}" },
  { action = "write", path = "export\\wasmrt_manifest.txt", text = "{param.manifest}" },
]
ready = [
  { f2f = "hello", timeout = 60 },
  { log = "{param.ready_marker}", stream = "latest", timeout = "{param.ready_timeout}" },
]
stop = [ { f2f = "quit", wait_exit = 8 } ]

[kinds.engine_rt.by_engine.v032]
exe = "{engine.builds.f2f}"
args = ["--f2f", "{port.f2f}", "--f2f-size", "{size}", "--res", "{engine.res}", "--dir", "{dir}", "--script", "{dir}\\{param.script}"]
