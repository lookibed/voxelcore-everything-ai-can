# Реестр версий движка VoxelCore для лаборатории (vclab/engines.py). Путей машины здесь нет: файлы ищутся под корнями
# machine.toml — стоковый релиз в {machine.engines_root}\<install_dir>, тестовая сборка F2F в
# {machine.builds_root}\<f2f_exe>; любую позицию можно перекрыть в machine.toml: [engines.<id>] root/res/stock/vctest/f2f.
# Происхождение и рецепт сборки — engines/<id>/ORIGIN.md; патч F2F — f2f/patches/; протокол — f2f/PROTOCOL.md.
#
# Поля версии: version (столбец истории/ворот), description, commit (то, что показывает lab engines), source_commit,
# release_url / zip_sha256 (стоковый zip), ci_run (если не релиз), install_dir, stock_exe, vctest_exe, stock_sha256,
# f2f_exe, f2f_sha256, f2f_patch, f2f_branch, f2f_commit, f2f_version (hello.version тестовой сборки: другая —
# engine-mismatch), f2f_repo (приватный репозиторий веток F2F).
# Сборка F2F (`lab f2f build <id>`, f2f/README.md): build_upstream (репозиторий upstream), build_base (тег/коммит, от которого
# снят патч: `git diff <build_base> <f2f_branch>`), build_vcpkg_commit / build_vcpkg_since (vcpkg рецепта релиза и глубина
# shallow clone), build_name (-DVC_BUILD_NAME: "" у CI-артефактов, версия у релизов), build_recipe_note (строка рецепта в
# hello.build), build_output (имя exe в build-mingw), build_env_dump (Lua-дамп окружения для сверки со стоком),
# menu_shot_sha256 (кадр меню F2F 854x480 после mode{fixed, seed 12345} + step{40,40}; "" — эталона нет).
# Где на ЭТОЙ машине лежат worktree и vcpkg — machine.toml `[engines.<id>] f2f_src = '...'`, `vcpkg = '...'`.
# legacy = true — версия нужна только снимку машины-источника (сток — CI-артефакт без публичной ссылки, exe F2F не
# опубликован): install/bootstrap её не ставит, `lab doctor` при отсутствии файлов пишет info, а не FAIL/warn.
# Обязательны версия по умолчанию и все версии без legacy.
# Раскладка «с нуля» (install/bootstrap): engines_root = <repo>\engines, builds_root = <repo>\builds; у v0327
# install_dir = "v0327" -> <repo>\engines\v0327\VoxelCore.exe, F2F -> <repo>\builds\0327\VoxelCoreF2F-0327-767234c5.exe.
[engines]
default = "v0327"

