# Каталог паков, композиций и проектов (волна 6, 29.10.2026). Человекочитаемая версия — docs/PACKS.md,
# как переносить на свежий движок — docs/PORTING.md.
#
# Поля:
#   layer             pack | composition | project | library (пак-библиотека без своего экрана)
#   path              путь в этом репозитории
#   origin            откуда: снимок lookibed/voxelcore-workbench-snapshot-2026-10 (content/<имя>) и свой репозиторий, если есть
#   version           package.json пака
#   depends_packs     зависимости package.json (+ фактические, если пак без них не работает)
#   depends_external  что нужно вне пака: Spider (транслятор wasm→Lua), исходники C/Java, эталоны, веса, данные игр
#   last_green_engine последняя версия движка, на которой пак доказанно работал (по agents/STATUS.md, OLIFE.md, ALPHAMINE.md,
#                     README паков): v031 | v032 (0.32.0/0.32.1) | v0327; "unknown" — источник не говорит
#   tests             проект лаборатории / сценарии (projects/vc/scenarios_legacy = старые tools/scenarios) / golden
#   size_mb           размер каталога пака в старом content/ (du -sm, 29.10)
#   notes             коротко: чем интересен, что ломалось
#
# Снимок: SNAP = "lookibed/voxelcore-workbench-snapshot-2026-10"

# ---------------------------------------------------------------- рантайм и библиотеки

[packs.wasmrt]
layer = "library"
path = "packs/wasmrt"
origin = ["SNAP:content/wasmrt", "github:lookibed/voxelcore-wasmrt"]
version = "0.1.0"
depends_packs = []
depends_external = ["Spider (/root/Spider, ветка voxelcore-bytearray-memory) — только чтобы пересобрать программы"]
last_green_engine = "v032"
tests = ["projects/wasmrt (lab)", "projects/vc/scenarios_legacy/wasmrt_page.lua", "smoke_all.py"]
size_mb = 1
notes = "Рантайм WebAssembly-программ, оттранслированных Spider в Lua: WASI, ABI vc.h, графика posteffect/canvas/gpu. База всех wasm-паков."

